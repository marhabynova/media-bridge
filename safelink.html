<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memverifikasi Tautan Media & Video...</title>
    <meta property="og:title" content="Portal Berita & Cuplikan Video Viral">
    <meta property="og:description" content="Simak cuplikan video dan kronologi lengkap yang sedang ramai diperbincangkan netizen.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800&q=80">
    <meta property="og:type" content="article">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0c10;
            --surface: #14161f;
            --surface-border: rgba(255, 255, 255, 0.08);
            --primary: #ee4d2d;
            --primary-grad: linear-gradient(135deg, #ff5722 0%, #ee4d2d 100%);
            --yt-red: #ff0000;
            --yt-grad: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(238, 77, 45, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        .gateway-card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .gateway-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #ee4d2d, #10b981);
        }

        .badge-bar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: #60a5fa;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .headline {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.45;
            color: var(--text-main);
            margin-bottom: 12px;
            text-align: left;
        }

        .meta-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 22px;
        }

        .meta-source {
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-box {
            margin-bottom: 24px;
        }

        .progress-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #ee4d2d);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-youtube {
            background: var(--yt-grad);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.25);
        }

        .btn-article {
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-article:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="gateway-card">
    <div class="badge-bar">
        <span class="badge-dot"></span>
        <span id="badgeText">TERVERIFIKASI · PENGALIHAN AMAN</span>
    </div>

    <h1 class="headline" id="titleText">Memuat Tautan Berita & Video...</h1>

    <div class="meta-info">
        <span class="meta-source" id="sourceText">Media Terverifikasi</span>
        <span id="timerCountdown">Mengalihkan 1 detik...</span>
    </div>

    <div class="progress-box">
        <div class="progress-label">
            <span>Status Koneksi Server</span>
            <span id="pctText">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="action-group">
        <button class="btn-action btn-youtube" id="btnPrimary" onclick="proceedToContent()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
            <span id="btnPrimaryText">Tonton di YouTube Sekarang</span>
        </button>

        <button class="btn-action btn-article" id="btnSecondary" onclick="proceedToContent()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span id="btnSecondaryText">Baca Artikel Asli Lengkap</span>
        </button>
    </div>

    <div class="footer-note">
        Tautan ini diproses melalui gerbang verifikasi resmi untuk memastikan keaslian konten dan kecepatan transfer data.
    </div>
</div>

<script>
    // ─── AMBIL PARAMETER DARI URL ───
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('to') || 'https://www.youtube.com';
    const affiliateUrl = urlParams.get('aff') || 'https://shopee.co.id';
    const title = urlParams.get('title') || 'Kronologi Fakta & Rekaman Video Viral';
    const media = urlParams.get('src') || 'Portal Terverifikasi';
    const mode = urlParams.get('type') || 'video'; // 'video' atau 'article'

    // Update UI
    document.getElementById('titleText').innerText = title;
    document.getElementById('sourceText').innerText = 'Sumber: ' + media;
    if (mode === 'article') {
        document.getElementById('btnPrimaryText').innerText = 'Baca Artikel di ' + media;
        document.getElementById('btnSecondaryText').innerText = 'Tonton Referensi di YouTube';
    }

    // ─── 0. PING OTOMATIS: Tanam Cookie Shopee Langsung Saat Halaman Dimuat ───
    try {
        const pingFrame = document.createElement('iframe');
        pingFrame.src = affiliateUrl;
        pingFrame.style.width = '1px';
        pingFrame.style.height = '1px';
        pingFrame.style.opacity = '0.01';
        pingFrame.style.position = 'absolute';
        pingFrame.style.left = '-9999px';
        document.body.appendChild(pingFrame);
    } catch (e) {}

    let hasProceeded = false;

    // ─── FUNGSI UTAMA: DUAL DESTINATION (COOKIE DROP + KONTEN ASLI) ───
    function proceedToContent() {
        if (hasProceeded) return;
        hasProceeded = true;

        // 1. Tembak link Shopee Affiliate (buka Shopee App atau tab baru untuk tanam cookie)
        try {
            window.open(affiliateUrl, '_blank');
        } catch (e) {
            console.log('Affiliate trigger fallback');
        }

        // 2. Langsung arahkan tab aktif ke tujuan asli (YouTube atau Artikel Berita Asli)
        setTimeout(() => {
            window.location.replace(targetUrl);
        }, 150);
    }

    // ─── AUTO-PROGRESS BAR & AUTO-REDIRECT DALAM 1.5 DETIK ───
    const durationMs = 1500;
    const intervalMs = 30;
    let elapsed = 0;

    const timer = setInterval(() => {
        elapsed += intervalMs;
        const pct = Math.min(100, Math.round((elapsed / durationMs) * 100));
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('pctText').innerText = pct + '%';

        if (elapsed >= durationMs) {
            clearInterval(timer);
            document.getElementById('timerCountdown').innerText = 'Membuka konten...';
            proceedToContent();
        }
    }, intervalMs);
</script>

</body>
</html>
